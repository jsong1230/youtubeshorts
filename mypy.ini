[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = False
strict_optional = False

[mypy-src.*]
disallow_untyped_defs = False

[mypy-tests.*]
ignore_errors = True
